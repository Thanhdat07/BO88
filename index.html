<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BO88 - Phát tài phát lộc</title>
    <style>
        :root {
            --gold: #ffd700;
            --dark: #111;
            --red: #d32f2f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: white;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        h1, h2, h3 { color: var(--gold); text-shadow: 2px 2px 5px black; }
        .slogan { color: #aaa; font-style: italic; margin-bottom: 20px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        /* Forms & Buttons */
        input, select {
            width: 80%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid var(--gold);
            background: #222; color: white;
        }
        button {
            background: linear-gradient(to bottom, #ffd700, #b8860b);
            border: none; padding: 12px 25px; margin: 10px 5px; font-weight: bold; border-radius: 8px;
            cursor: pointer; color: #111; text-transform: uppercase; box-shadow: 0 4px 6px rgba(255,215,0,0.3);
            transition: 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .btn-red { background: linear-gradient(to bottom, #e53935, #b71c1c); color: white; }
        
        /* Dashboard & Layouts */
        #dashboard, #deposit-section, #withdraw-section, #history-section { display: none; }
        .balance-box {
            background: #222; border: 2px solid var(--gold); border-radius: 10px; padding: 15px; margin: 20px 0;
            font-size: 24px; font-weight: bold;
        }
        
        /* Slot Machine */
        .slot-machine {
            display: flex; justify-content: center; gap: 15px; margin: 30px 0;
            background: #333; padding: 20px; border-radius: 15px; border: 3px solid var(--gold);
        }
        .reel {
            width: 120px; height: 120px; background: white; border-radius: 10px;
            border: 2px solid #555; overflow: hidden; display: flex; align-items: center; justify-content: center;
        }
        .reel img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Utilities */
        .history-list { text-align: left; background: #222; padding: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto; }
        .history-item { border-bottom: 1px solid #444; padding: 8px 0; display: flex; justify-content: space-between; }
        .qr-box { margin: 20px 0; background: white; padding: 10px; display: inline-block; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <h1>BO88</h1>
        <div class="slogan">"Phát tài phát lộc" <br> <small>by 3AE GROUP</small></div>

        <!-- AUTHENTICATION SECTION -->
        <div id="auth-section">
            <h2>ĐĂNG NHẬP / ĐĂNG KÝ</h2>
            <input type="text" id="username" placeholder="Tên tài khoản"><br>
            <input type="password" id="password" placeholder="Mật khẩu"><br>
            <button onclick="login()">Đăng Nhập</button>
            <button onclick="register()">Đăng Ký</button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard">
            <div class="balance-box">
                SỐ DƯ: <span id="balance-display" style="color:var(--gold);">0</span> VND
            </div>
            
            <button onclick="dailyCheckIn()">Điểm danh hằng ngày</button>
            <button onclick="switchView('deposit-section')">Nạp Tiền</button>
            <button onclick="switchView('withdraw-section')">Rút Tiền</button>
            <button class="btn-red" onclick="logout()">Đăng Xuất</button>

            <!-- TRÒ CHƠI NỔ HŨ -->
            <h3>SLOT CẦU THỦ THẾ GIỚI</h3>
            <p>Giá mỗi lần quay: <strong>10,000 VND</strong></p>
            <div class="slot-machine">
                <div class="reel"><img id="reel1" src="https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg"></div>
                <div class="reel"><img id="reel2" src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg"></div>
                <div class="reel"><img id="reel3" src="https://upload.wikimedia.org/wikipedia/commons/b/bb/Neymar_Jr._with_Al_Hilal%2C_3_October_2023_-_03_%28cropped%29.jpg"></div>
            </div>
            <button style="font-size: 20px; padding: 15px 40px;" onclick="spin()">QUAY NGAY</button>
        </div>

        <!-- DEPOSIT SECTION -->
        <div id="deposit-section">
            <h2>NẠP TIỀN</h2>
            <p>Nhập số tiền (Tối thiểu 50,000 VND)</p>
            <input type="number" id="deposit-amount" placeholder="VD: 50000">
            <button onclick="generateQR()">Tạo Mã QR</button>
            
            <div id="qr-container" style="display:none;">
                <div class="qr-box">
                    <img id="qr-image" src="" alt="QR Code">
                </div>
                <p>Chủ TK: <strong>NGUYEN CHI THANH DAT</strong><br>STK: <strong>7783863107</strong></p>
                <button class="btn-red" onclick="confirmDeposit()">ĐÃ CHUYỂN KHOẢN</button>
            </div>
            <br><button onclick="switchView('dashboard')">Quay Lại</button>
        </div>

        <!-- WITHDRAW SECTION -->
        <div id="withdraw-section">
            <h2>RÚT TIỀN</h2>
            <select id="bank-name">
                <option value="Vietcombank">Vietcombank</option>
                <option value="Techcombank">Techcombank</option>
                <option value="MBBank">MB Bank</option>
                <option value="ACB">ACB</option>
            </select>
            <input type="text" id="bank-account" placeholder="Số tài khoản">
            <input type="number" id="withdraw-amount" placeholder="Số tiền cần rút">
            <button onclick="submitWithdraw()">Tạo Lệnh Rút</button>

            <h3>LỊCH SỬ GIAO DỊCH</h3>
            <div class="history-list" id="history-list"></div>
            <br><button onclick="switchView('dashboard')">Quay Lại</button>
        </div>
    </div>

    <!-- Âm thanh -->
    <audio id="spinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-slot-machine-wheel-1932.mp3"></audio>
    <audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>

    <script>
        /* --- HỆ THỐNG DỮ LIỆU --- */
        let currentUser = null;
        const players = [
            "https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg", // Ronaldo
            "https://upload.wikimedia.org/wikipedia/commons/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg", // Messi
            "https://upload.wikimedia.org/wikipedia/commons/b/bb/Neymar_Jr._with_Al_Hilal%2C_3_October_2023_-_03_%28cropped%29.jpg", // Neymar
            "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Kylian_Mbapp%C3%A9_and_J%C3%A9r%C3%B4me_Prior.jpg/330px-Kylian_Mbapp%C3%A9_and_J%C3%A9r%C3%B4me_Prior.jpg" // Mbappe
        ];

        /* --- XÁC THỰC (ĐĂNG NHẬP/ĐĂNG KÝ) --- */
        function register() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            if(!u || !p) return alert("Vui lòng nhập đầy đủ Tên và Mật khẩu!");
            
            let users = JSON.parse(localStorage.getItem('bo88_users')) || {};
            if(users[u]) return alert("Tài khoản đã tồn tại! Vui lòng chọn tên khác.");
            
            users[u] = { 
                password: p, balance: 0, lastCheckIn: null, checkInStreak: 0, history: [] 
            };
            localStorage.setItem('bo88_users', JSON.stringify(users));
            alert("Tạo tài khoản thành công! Vui lòng đăng nhập.");
        }

        function login() {
            let u = document.getElementById('username').value;
            let p = document.getElementById('password').value;
            let users = JSON.parse(localStorage.getItem('bo88_users')) || {};
            
            if(users[u] && users[u].password === p) {
                currentUser = u;
                updateUI();
                switchView('dashboard');
            } else {
                alert("Sai tên tài khoản hoặc mật khẩu!");
            }
        }

        function logout() {
            currentUser = null;
            switchView('auth-section');
        }

        /* --- ĐIỂM DANH HẰNG NGÀY --- */
        function dailyCheckIn() {
            let users = JSON.parse(localStorage.getItem('bo88_users'));
            let user = users[currentUser];
            let today = new Date().toDateString();

            if (user.lastCheckIn === today) {
                alert("Bạn đã điểm danh hôm nay rồi! Quay lại vào ngày mai nhé.");
                return;
            }

            // Logic tính tiền (Ngày 1: 10k, Ngày tiếp theo +5k)
            let reward = 10000;
            if (user.lastCheckIn) {
                let lastDate = new Date(user.lastCheckIn);
                let diffTime = Math.abs(new Date() - lastDate);
                let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffDays === 1) user.checkInStreak++;
                else user.checkInStreak = 0;
            } else {
                user.checkInStreak = 0;
            }

            reward += (user.checkInStreak * 5000);
            user.balance += reward;
            user.lastCheckIn = today;
            
            localStorage.setItem('bo88_users', JSON.stringify(users));
            updateUI();
            alert(`Điểm danh thành công! Bạn nhận được ${reward.toLocaleString()} VND.`);
        }

        /* --- NẠP TIỀN & MÃ QR --- */
        let pendingDeposit = 0;
        function generateQR() {
            let amount = parseInt(document.getElementById('deposit-amount').value);
            if (amount < 50000) return alert("Số tiền tối thiểu là 50,000 VND!");
            pendingDeposit = amount;
            
            // Tạo mã QR tự động bao gồm Số tiền & Tên tài khoản
            let qrData = `Chuyen_khoan_${amount}_cho_NGUYEN_CHI_THANH_DAT_7783863107`;
            document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${qrData}`;
            document.getElementById('qr-container').style.display = "block";
        }

        function confirmDeposit() {
            let users = JSON.parse(localStorage.getItem('bo88_users'));
            users[currentUser].balance += pendingDeposit;
            users[currentUser].history.push({ type: 'Nạp tiền', amount: pendingDeposit, status: 'Thành công', time: new Date().toLocaleString() });
            localStorage.setItem('bo88_users', JSON.stringify(users));
            
            alert(`Xác nhận thành công! Đã cộng ${pendingDeposit.toLocaleString()} VND vào tài khoản.`);
            document.getElementById('qr-container').style.display = "none";
            document.getElementById('deposit-amount').value = "";
            updateUI();
            switchView('dashboard');
        }

        /* --- RÚT TIỀN --- */
        function submitWithdraw() {
            let bank = document.getElementById('bank-name').value;
            let acc = document.getElementById('bank-account').value;
            let amount = parseInt(document.getElementById('withdraw-amount').value);
            
            if(!acc || !amount) return alert("Vui lòng nhập đủ thông tin!");
            
            let users = JSON.parse(localStorage.getItem('bo88_users'));
            if(amount > users[currentUser].balance) return alert("Số dư không đủ!");
            
            // Trừ tiền và lưu lịch sử
            users[currentUser].balance -= amount;
            users[currentUser].history.push({ type: 'Rút tiền', amount: amount, status: 'Đang xử lý', time: new Date().toLocaleString() });
            localStorage.setItem('bo88_users', JSON.stringify(users));
            
            alert("Tạo lệnh rút tiền thành công. Vui lòng chờ hệ thống xử lý!");
            document.getElementById('bank-account').value = "";
            document.getElementById('withdraw-amount').value = "";
            updateUI();
            renderHistory();
        }

        /* --- TRÒ CHƠI NỔ HŨ (TỈ LỆ 80% THẮNG) --- */
        let isSpinning = false;
        function spin() {
            if(isSpinning) return;
            let users = JSON.parse(localStorage.getItem('bo88_users'));
            if(users[currentUser].balance < 10000) return alert("Số dư không đủ, vui lòng nạp thêm tiền!");
            
            // Trừ tiền cược
            users[currentUser].balance -= 10000;
            localStorage.setItem('bo88_users', JSON.stringify(users));
            updateUI();

            isSpinning = true;
            document.getElementById('spinSound').play();
            let r1 = document.getElementById('reel1'), r2 = document.getElementById('reel2'), r3 = document.getElementById('reel3');
            
            // Hiệu ứng quay
            let spinInterval = setInterval(() => {
                r1.src = players[Math.floor(Math.random() * players.length)];
                r2.src = players[Math.floor(Math.random() * players.length)];
                r3.src = players[Math.floor(Math.random() * players.length)];
            }, 100);

            setTimeout(() => {
                clearInterval(spinInterval);
                
                // Thuật toán: Tỉ lệ 80% thắng
                let win = Math.random() < 0.8;
                if(win) {
                    let winPlayer = players[Math.floor(Math.random() * players.length)];
                    r1.src = winPlayer; r2.src = winPlayer; r3.src = winPlayer;
                    
                    document.getElementById('winSound').play();
                    let reward = 50000 + Math.floor(Math.random() * 50000); // Thưởng ngẫu nhiên từ 50k - 100k
                    users = JSON.parse(localStorage.getItem('bo88_users'));
                    users[currentUser].balance += reward;
                    localStorage.setItem('bo88_users', JSON.stringify(users));
                    updateUI();
                    
                    setTimeout(() => alert(`🎉 NỔ HŨ! BẠN TRÚNG ${reward.toLocaleString()} VND! 🎉`), 500);
                } else {
                    // Đảm bảo không trùng 3 hình khi thua
                    r1.src = players[0]; r2.src = players[1]; r3.src = players[2];
                }
                isSpinning = false;
            }, 2000); // Quay 2 giây
        }

        /* --- GIAO DIỆN CHUNG --- */
        function switchView(viewId) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('deposit-section').style.display = 'none';
            document.getElementById('withdraw-section').style.display = 'none';
            document.getElementById(viewId).style.display = 'block';
            if(viewId === 'withdraw-section') renderHistory();
        }

        function updateUI() {
            let users = JSON.parse(localStorage.getItem('bo88_users'));
            document.getElementById('balance-display').innerText = users[currentUser].balance.toLocaleString();
        }

        function renderHistory() {
            let users = JSON.parse(localStorage.getItem('bo88_users'));
            let historyHTML = users[currentUser].history.reverse().map(h => 
                `<div class="history-item">
                    <span>${h.time} - <b>${h.type}</b></span>
                    <span><b style="color:var(--gold);">${h.amount.toLocaleString()} đ</b> (${h.status})</span>
                </div>`
            ).join('');
            document.getElementById('history-list').innerHTML = historyHTML || "<p>Chưa có giao dịch nào.</p>";
        }
    </script>
</body>
</html>
